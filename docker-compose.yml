version: '3'

services:
  rag_ai:
    image: ${DOCKER_USERNAME:-your-dockerhub-username}/rag_ai:latest
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=true
      - TESSDATA_PREFIX=/usr/local/share/tessdata/ 